# Komodo stack: momas-sync
# Files on host: ${MOMAS_ROOT:-/etc/komodo/stacks/momas-sync}/compose.yaml
# Komodo: Run Build = true, Auto Pull = false
# app/ must contain Dockerfile, .dockerignore, pyproject.toml, README.md, LICENSE and src/.
services:
  momas-sync:
    image: momas-sync:0.4.0
    build:
      context: ${MOMAS_ROOT:-/etc/komodo/stacks/momas-sync}/app
    pull_policy: never
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    entrypoint: ["momas-worker"]
    command: ["serve"]
    environment:
      BAFANG_AUTH_MODE: login
      BAFANG_ACCOUNT_FILE: /run/secrets/bafang_account
      BAFANG_PASSWORD_FILE: /run/secrets/bafang_password
      BAFANG_DEVICE_ID: ${BAFANG_DEVICE_ID:-}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Zurich}
      DATA_DIR: /data/sync
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-1800}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-30}
      SYNC_MAX_PAGES: ${SYNC_MAX_PAGES:-1000}
      BAFANG_PAGE_SIZE: ${BAFANG_PAGE_SIZE:-20}
      RETRY_ATTEMPTS: ${RETRY_ATTEMPTS:-4}
      RETRY_BASE_SECONDS: ${RETRY_BASE_SECONDS:-2}
      RETRY_CAP_SECONDS: ${RETRY_CAP_SECONDS:-60}
      HEALTH_STALE_SECONDS: ${HEALTH_STALE_SECONDS:-3900}
      ENDURAIN_ENABLED: ${ENDURAIN_ENABLED:-false}
      ENDURAIN_URL: ${ENDURAIN_URL:-}
      ENDURAIN_API_KEY_FILE: /run/secrets/endurain_api_key
    secrets:
      - bafang_account
      - bafang_password
      - endurain_api_key
    volumes:
      - ${MOMAS_ROOT:-/etc/komodo/stacks/momas-sync}/data:/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 150s
    healthcheck:
      test: ["CMD", "momas-worker", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
secrets:
  bafang_account:
    file: ${MOMAS_ROOT:-/etc/komodo/stacks/momas-sync}/secrets/bafang_account
  bafang_password:
    file: ${MOMAS_ROOT:-/etc/komodo/stacks/momas-sync}/secrets/bafang_password
  endurain_api_key:
    file: ${MOMAS_ROOT:-/etc/komodo/stacks/momas-sync}/secrets/endurain_api_key
